# M1 acceptance deployment. Atlas is external; no database secrets belong here.
services:
  - type: web
    name: ai-growth-os-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: "off"
    buildCommand: npm ci --prefix backend --include=dev && npm run build --prefix backend
    startCommand: npm run db:migrate --prefix backend && npm start --prefix backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: APP_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
  - type: web
    name: ai-growth-os-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: "off"
    buildCommand: npm ci --prefix web --include=dev && npm run sync-ui --prefix web && npm run build --prefix web
    startCommand: npm start --prefix web -- --hostname 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_INTERNAL_URL
        sync: false
  # Public, isolated crawler acceptance website; no production/customer data.
  - type: web
    name: ai-growth-os-crawler-test
    runtime: static
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: echo "Static crawler fixture"
    staticPublishPath: crawler-fixture
    buildFilter:
      paths:
        - crawler-fixture/**
        - render.yaml
    routes:
      - type: redirect
        source: /legacy-services
        destination: /services/
      - type: redirect
        source: /redirect-chain-start
        destination: /redirect-chain-middle
      - type: redirect
        source: /redirect-chain-middle
        destination: /services/
      - type: redirect
        source: /redirect-loop-a
        destination: /redirect-loop-b
      - type: redirect
        source: /redirect-loop-b
        destination: /redirect-loop-a
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
